<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบพัฒนางานข้าราชการครูและบุคลากรทางการศึกษา โรงเรียนบ้านโคกม่วย</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Font & Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', // Teal
                            600: '#0d9488',
                            700: '#0f766e',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Styles & Animations */
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #0d9488 100%);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass-header text-white sticky top-0 z-50 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:py-5 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-4 w-full md:w-auto">
                <!-- Logo -->
                <div class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-2xl p-1.5 flex items-center justify-center border border-white/30 shadow-lg shrink-0">
                    <img 
                        src="kms_logo.png" 
                        alt="Logo" 
                        class="w-full h-full object-contain filter drop-shadow-md"
                        onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Logo_of_the_Ministry_of_Education_of_Thailand.svg/1200px-Logo_of_the_Ministry_of_Education_of_Thailand.svg.png'"
                    />
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-bold tracking-tight leading-tight shadow-black/50 text-shadow">
                        ระบบพัฒนางานข้าราชการครูและบุคลากรทางการศึกษา
                    </h1>
                    <p class="text-xs sm:text-sm text-blue-100 font-medium mt-0.5">
                        โรงเรียนบ้านโคกม่วย สำนักงานเขตพื้นที่การศึกษาประถมศึกษาหนองบัวลำภู เขต 1
                    </p>
                </div>
            </div>
            <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-full text-sm text-white border border-white/20 flex items-center gap-2 shadow-inner shrink-0 self-start md:self-auto">
                <i data-lucide="calendar" class="w-4 h-4"></i> ปีการศึกษา 2569
            </div>
        </div>
    </header>

    <!-- Main Content Root -->
    <main id="app-root" class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full"></main>

    <!-- Footer -->
    <footer class="mt-auto bg-white/80 backdrop-blur-sm border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        <p>© 2569 โรงเรียนบ้านโคกม่วย สำนักงานเขตพื้นที่การศึกษาประถมศึกษาหนองบัวลำภู เขต 1</p>
    </footer>

    <!-- Application Logic -->
    <script>
        // --- MOCK DATA ---
        const TEACHERS = [
            {
                id: 5,
                name: 'นายเชาวนันท์ โสโท',
                position: 'ผู้อำนวยการสถานศึกษา',
                department: 'ผู้บริหารสถานศึกษา',
                avatar: 'director_chao.png',
                documents: [
                    { year: '2569', idPlan: 'ID Plan Chaowanan 2569.pdf', pa: 'https://sites.google.com/view/classroomkruchao/performance-agreement-pa/pa-2569' }
                ]
            },
            {
                id: 1,
                name: 'นางสาวรัตนา โคตรวิทย์',
                position: 'ครูชำนาญการพิเศษ',
                department: 'กลุ่มสาระการเรียนรู้คณิตศาสตร์',
                avatar: 'kru_nuch.png',
                documents: [
                    { year: '2569', idPlan: null, pa: 'https://chaochichi.github.io/pa/pa_rattana.html' }
                ]
            },
            {
                id: 2,
                name: 'นางรุ่งฤดี บุญเกิด',
                position: 'ครูชำนาญการพิเศษ',
                department: 'กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี',
                avatar: 'kru_koa.png',
                documents: [
                    { year: '2569', idPlan: 'ID Plan Rungruedee 2569.pdf', pa: 'https://chaochichi.github.io/pa/teacher_pa_runruedee_2569.html' }
                ]
            },
            {
                id: 3,
                name: 'นางวิภาพร ธรรมวิเศษ',
                position: 'ครูชำนาญการ',
                department: 'กลุ่มสาระการเรียนรู้สังคมศึกษา ศาสนา และวัฒนธรรม',
                avatar: 'kru_boong.png',
                documents: [
                    { year: '2569', idPlan: null, pa: 'https://chaochichi.github.io/pa/pa_wipaporn.html' }
                ]
            },
            {
                id: 4,
                name: 'นางสาวอรพรรณ เฉลียวดี',
                position: 'พนักงานราชการ',
                department: 'กลุ่มสาระการเรียนรู้ภาษาไทย',
                avatar: 'kru_fon.png',
                documents: [
                    { year: '2569', idPlan: 'ID Plan Fonn 2569.pdf', pa: null } // ไม่มี PA
                ]
            }
        ];

        const DEPARTMENTS = [
            'ทั้งหมด', 
            'ผู้บริหารสถานศึกษา',
            'กลุ่มสาระการเรียนรู้คณิตศาสตร์', 
            'กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี', 
            'กลุ่มสาระการเรียนรู้สังคมศึกษา ศาสนา และวัฒนธรรม',
            'กลุ่มสาระการเรียนรู้ภาษาไทย'
        ];

        // --- STATE MANAGEMENT ---
        let state = {
            selectedTeacherId: null,
            searchQuery: '',
            selectedDept: 'ทั้งหมด',
            selectedYear: '2569'
        };

        // --- RENDER FUNCTIONS ---
        function render() {
            const root = document.getElementById('app-root');
            if (state.selectedTeacherId === null) {
                root.innerHTML = getDirectoryHTML();
            } else {
                root.innerHTML = getProfileHTML();
            }
            // Re-initialize icons after DOM update
            lucide.createIcons();
        }

        function getDirectoryHTML() {
            // Filter teachers
            const filtered = TEACHERS.filter(t => {
                const matchName = t.name.toLowerCase().includes(state.searchQuery.toLowerCase());
                const matchDept = state.selectedDept === 'ทั้งหมด' || t.department === state.selectedDept;
                return matchName && matchDept;
            });

            // Build Options
            const deptOptions = DEPARTMENTS.map(dept => 
                `<option value="${dept}" ${state.selectedDept === dept ? 'selected' : ''}>${dept}</option>`
            ).join('');

            // Build Teacher Cards
            let cardsHTML = '';
            if (filtered.length > 0) {
                cardsHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 fade-in">`;
                filtered.forEach(teacher => {
                    const fallbackSeed = encodeURIComponent(teacher.name);
                    cardsHTML += `
                        <div onclick="selectTeacher(${teacher.id})" 
                             class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 card-hover cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div class="absolute top-0 left-0 right-0 h-3 bg-gradient-to-r from-blue-500 to-teal-400 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            
                            <div class="relative mb-4">
                                <div class="absolute inset-0 bg-blue-100 rounded-full scale-110 opacity-0 group-hover:opacity-100 transition-all duration-300"></div>
                                <img src="${teacher.avatar}" 
                                     alt="${teacher.name}" 
                                     class="relative w-28 h-28 rounded-full bg-white p-1 border-4 border-white shadow-md object-contain transition-transform duration-300 group-hover:scale-105"
                                     onerror="this.src='https://api.dicebear.com/7.x/notionists/svg?seed=${fallbackSeed}&backgroundColor=e0f2fe'"
                                />
                            </div>
                            
                            <h3 class="text-lg font-bold text-slate-800 group-hover:text-blue-600 transition-colors">${teacher.name}</h3>
                            <p class="text-sm text-teal-600 font-semibold mb-3 mt-1">${teacher.position}</p>
                            <span class="text-[11px] text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full mt-auto line-clamp-1 border border-slate-200">
                                ${teacher.department}
                            </span>
                        </div>
                    `;
                });
                cardsHTML += `</div>`;
            } else {
                cardsHTML = `
                    <div class="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-300 shadow-sm fade-in">
                        <i data-lucide="users" class="w-16 h-16 mx-auto text-slate-300 mb-4"></i>
                        <p class="text-slate-600 font-medium text-lg">ไม่พบข้อมูลบุคลากรที่ค้นหา</p>
                        <p class="text-sm text-slate-400 mt-2">ลองเปลี่ยนคำค้นหาหรือตัวกรองกลุ่มสาระฯ</p>
                    </div>
                `;
            }

            return `
                <div class="space-y-8 fade-in">
                    <!-- Controls Header -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-5 bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-blue-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
                        
                        <div class="relative z-10">
                            <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="users" class="text-blue-600"></i> ทำเนียบครูและบุคลากร
                            </h2>
                            <p class="text-slate-500 mt-1">ค้นหาและเลือกรายชื่อเพื่อเรียกดูเอกสาร ID Plan และ PA</p>
                        </div>
                        
                        <!-- Search & Filter -->
                        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto relative z-10">
                            <div class="relative w-full sm:w-64">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                                </div>
                                <input
                                    type="text"
                                    placeholder="ค้นหาชื่อ-นามสกุล..."
                                    class="pl-10 pr-4 py-2.5 border border-slate-200 rounded-2xl w-full focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm bg-slate-50"
                                    value="${state.searchQuery}"
                                    onkeyup="updateSearch(this.value)"
                                />
                            </div>
                            <div class="relative w-full sm:w-64">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                    <i data-lucide="filter" class="w-4 h-4 text-slate-400"></i>
                                </div>
                                <select
                                    class="pl-10 pr-8 py-2.5 border border-slate-200 rounded-2xl w-full appearance-none bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm cursor-pointer"
                                    onchange="updateDept(this.value)"
                                >
                                    ${deptOptions}
                                </select>
                                <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none">
                                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Grid -->
                    ${cardsHTML}
                </div>
            `;
        }

        function getProfileHTML() {
            const teacher = TEACHERS.find(t => t.id === state.selectedTeacherId);
            if (!teacher) return '';

            const currentDocs = teacher.documents.find(d => d.year === state.selectedYear);
            const fallbackSeed = encodeURIComponent(teacher.name);

            // Year Tabs
            const yearTabs = teacher.documents.map(doc => `
                <button onclick="selectYear('${doc.year}')"
                    class="px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 ${
                        state.selectedYear === doc.year
                            ? 'bg-blue-600 text-white shadow-lg shadow-blue-200 ring-2 ring-blue-600 ring-offset-2'
                            : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 hover:border-slate-300'
                    }">
                    ปีการศึกษา ${doc.year}
                </button>
            `).join('');

            // Document Cards
            let docsHTML = '';
            if (currentDocs) {
                // ID Plan HTML
                if (currentDocs.idPlan && currentDocs.idPlan !== '#') {
                    docsHTML += `
                        <a href="${currentDocs.idPlan}" target="_blank" rel="noopener noreferrer" class="block group h-full">
                            <div class="h-full bg-gradient-to-br from-sky-50 to-white border border-sky-100 rounded-3xl p-6 sm:p-8 card-hover flex flex-col justify-between relative overflow-hidden">
                                <div class="absolute -right-6 -top-6 w-32 h-32 bg-sky-100 rounded-full blur-2xl opacity-50 group-hover:scale-150 transition-transform duration-700"></div>
                                <div class="relative z-10">
                                    <div class="w-14 h-14 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center mb-5 group-hover:scale-110 group-hover:-rotate-3 transition-transform shadow-sm">
                                        <i data-lucide="book-open" class="w-7 h-7"></i>
                                    </div>
                                    <h4 class="text-xl font-bold text-slate-800 mb-2">ID Plan</h4>
                                    <p class="text-sm text-slate-500 leading-relaxed">แผนพัฒนาตนเองรายบุคคล<br>ประจำปีการศึกษา ${currentDocs.year}</p>
                                </div>
                                <div class="mt-8 pt-4 border-t border-sky-100 text-sky-600 text-sm font-bold flex items-center group-hover:translate-x-2 transition-transform relative z-10">
                                    เปิดดูเอกสาร <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                                </div>
                            </div>
                        </a>
                    `;
                } else {
                    docsHTML += `
                        <div class="h-full bg-slate-50 border border-slate-200 rounded-3xl p-6 sm:p-8 flex flex-col justify-between relative overflow-hidden">
                            <div class="absolute inset-0 bg-stripes opacity-10"></div>
                            <div class="relative z-10 opacity-75">
                                <div class="w-14 h-14 bg-slate-200 text-slate-400 rounded-2xl flex items-center justify-center mb-5">
                                    <i data-lucide="book-open" class="w-7 h-7"></i>
                                </div>
                                <h4 class="text-xl font-bold text-slate-600 mb-2">ID Plan</h4>
                                <p class="text-sm text-slate-400">แผนพัฒนาตนเองรายบุคคล<br>ประจำปีการศึกษา ${currentDocs.year}</p>
                            </div>
                            <div class="mt-8 relative z-10 text-sm text-slate-500 font-medium bg-slate-200/60 py-3 px-4 rounded-xl text-center border border-slate-300">
                                <i data-lucide="clock" class="w-4 h-4 inline-block mr-1 -mt-0.5"></i> รอดำเนินการจัดทำเอกสาร
                            </div>
                        </div>
                    `;
                }

                // PA HTML
                if (teacher.position === 'พนักงานราชการ' && !currentDocs.pa) {
                    docsHTML += `
                        <div class="h-full bg-slate-50 border border-slate-200 rounded-3xl p-6 sm:p-8 flex flex-col justify-between relative overflow-hidden">
                            <div class="absolute inset-0 bg-stripes opacity-10"></div>
                            <div class="relative z-10 opacity-75">
                                <div class="w-14 h-14 bg-slate-200 text-slate-400 rounded-2xl flex items-center justify-center mb-5">
                                    <i data-lucide="target" class="w-7 h-7"></i>
                                </div>
                                <h4 class="text-xl font-bold text-slate-600 mb-2">PA (Performance Agreement)</h4>
                                <p class="text-sm text-slate-400">บันทึกข้อตกลงในการพัฒนางาน</p>
                            </div>
                            <div class="mt-8 relative z-10 text-sm text-slate-500 font-medium bg-slate-200/60 py-3 px-4 rounded-xl text-center border border-slate-300">
                                <i data-lucide="info" class="w-4 h-4 inline-block mr-1 -mt-0.5"></i> ยกเว้นการจัดทำ PA (พนักงานราชการ)
                            </div>
                        </div>
                    `;
                } else {
                    docsHTML += `
                        <a href="${currentDocs.pa}" target="_blank" rel="noopener noreferrer" class="block group h-full">
                            <div class="h-full bg-gradient-to-br from-emerald-50 to-white border border-emerald-100 rounded-3xl p-6 sm:p-8 card-hover flex flex-col justify-between relative overflow-hidden">
                                <div class="absolute -right-6 -top-6 w-32 h-32 bg-emerald-100 rounded-full blur-2xl opacity-50 group-hover:scale-150 transition-transform duration-700"></div>
                                <div class="relative z-10">
                                    <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-5 group-hover:scale-110 group-hover:rotate-3 transition-transform shadow-sm">
                                        <i data-lucide="target" class="w-7 h-7"></i>
                                    </div>
                                    <h4 class="text-xl font-bold text-slate-800 mb-2">PA (Performance Agreement)</h4>
                                    <p class="text-sm text-slate-500 leading-relaxed">บันทึกข้อตกลงในการพัฒนางาน<br>ประจำปีการศึกษา ${currentDocs.year}</p>
                                </div>
                                <div class="mt-8 pt-4 border-t border-emerald-100 text-emerald-600 text-sm font-bold flex items-center group-hover:translate-x-2 transition-transform relative z-10">
                                    เปิดดูเอกสาร <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                                </div>
                            </div>
                        </a>
                    `;
                }
            } else {
                docsHTML = `
                    <div class="col-span-1 sm:col-span-2 text-center py-16 text-slate-400 bg-slate-50 rounded-3xl border border-dashed border-slate-200">
                        <i data-lucide="folder-x" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                        <p class="font-medium text-lg">ไม่พบข้อมูลเอกสาร</p>
                        <p class="text-sm">ไม่มีการบันทึกข้อมูลเอกสารสำหรับปีการศึกษานี้</p>
                    </div>
                `;
            }

            return `
                <div class="space-y-6 fade-in max-w-5xl mx-auto">
                    <!-- Back Button -->
                    <button onclick="goBack()" class="inline-flex items-center text-slate-500 hover:text-blue-600 font-medium transition-colors bg-white px-5 py-2.5 rounded-full shadow-sm border border-slate-200 text-sm hover:shadow-md group">
                        <i data-lucide="arrow-left" class="w-4 h-4 mr-2 group-hover:-translate-x-1 transition-transform"></i>
                        กลับไปหน้าทำเนียบครู
                    </button>

                    <div class="flex flex-col lg:flex-row gap-8">
                        <!-- Left Column: Teacher Info -->
                        <div class="w-full lg:w-1/3 shrink-0">
                            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 sticky top-28 overflow-hidden relative">
                                <div class="absolute top-0 left-0 right-0 h-24 bg-gradient-to-b from-blue-50 to-white"></div>
                                
                                <div class="flex flex-col items-center text-center relative z-10">
                                    <div class="relative mb-5">
                                        <div class="absolute inset-0 bg-blue-100 rounded-full scale-110"></div>
                                        <img src="${teacher.avatar}" 
                                             alt="${teacher.name}" 
                                             class="relative w-32 h-32 rounded-full bg-white p-1 border-4 border-white shadow-lg object-contain"
                                             onerror="this.src='https://api.dicebear.com/7.x/notionists/svg?seed=${fallbackSeed}&backgroundColor=e0f2fe'"
                                        />
                                    </div>
                                    <h2 class="text-2xl font-bold text-slate-900">${teacher.name}</h2>
                                    <span class="inline-flex items-center bg-teal-50 text-teal-700 text-sm font-semibold px-4 py-1.5 rounded-full mt-3 border border-teal-100">
                                        ${teacher.position}
                                    </span>
                                    <p class="text-sm text-slate-500 mt-4 font-medium px-4 py-2 bg-slate-50 rounded-xl w-full border border-slate-100">
                                        ${teacher.department}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Documents Section -->
                        <div class="w-full lg:w-2/3 space-y-6">
                            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-10">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                                    <h3 class="text-2xl font-bold text-slate-900 flex items-center">
                                        <i data-lucide="award" class="text-blue-600 w-7 h-7 mr-3"></i>
                                        เอกสารการปฏิบัติงาน
                                    </h3>
                                </div>

                                <!-- Year Selector Tabs -->
                                <div class="mb-10">
                                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-3 flex items-center">
                                        <i data-lucide="calendar" class="w-4 h-4 mr-2 text-slate-400"></i> เลือกปีการศึกษา
                                    </label>
                                    <div class="flex flex-wrap gap-3">
                                        ${yearTabs}
                                    </div>
                                </div>

                                <!-- Document Links -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    ${docsHTML}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- EVENT HANDLERS ---
        window.updateSearch = function(value) {
            state.searchQuery = value;
            render();
        }

        window.updateDept = function(value) {
            state.selectedDept = value;
            render();
        }

        window.selectTeacher = function(id) {
            state.selectedTeacherId = id;
            
            // Set default year if documents exist
            const teacher = TEACHERS.find(t => t.id === id);
            if (teacher && teacher.documents.length > 0) {
                state.selectedYear = teacher.documents[0].year;
            }
            
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.goBack = function() {
            state.selectedTeacherId = null;
            render();
        }

        window.selectYear = function(year) {
            state.selectedYear = year;
            render();
        }

        // --- INITIALIZE ---
        // Basic stripes CSS for PA disabled card
        const style = document.createElement('style');
        style.textContent = `
            .bg-stripes {
                background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%, transparent 50%, #e2e8f0 50%, #e2e8f0 75%, transparent 75%, transparent);
                background-size: 20px 20px;
            }
        `;
        document.head.appendChild(style);

        // First render
        render();

    </script>
</body>
</html>
